<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Generator 🔐</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet" href="password.css">

</head>

<body>

<header>

<h1>🔐 Password Generator</h1>

<p>Create strong secure passwords instantly</p>

</header>

<main class="tool-page">

<h2 id="passwordDisplay">

Your password

</h2>

<label>

Password Length:

<input id="length" type="number" value="16" min="4" max="50">

</label>

<div>

<label>

<input id="uppercase" type="checkbox" checked>

Uppercase

</label>

<label>

<input id="lowercase" type="checkbox" checked>

Lowercase

</label>

<label>

<input id="numbers" type="checkbox" checked>

Numbers

</label>

<label>

<input id="symbols" type="checkbox" checked>

Symbols

</label>

</div>

<button id="generate">

Generate

</button>

<button id="copy">

Copy 📋

</button>

<p id="strength">

Strength: -

</p>

<br>

<a class="back" href="../index.html">

⬅ Back Home

</a>

</main>

<script src="password.js"></script>

</body>

</html>
