<header>

<h1>⚖️ Weight & BMI Calculator</h1>

<button id="calculate">Calculate BMI</button>

<h2 id="bmiResult">BMI: --</h2>

<h3 id="status">Status: --</h3>

<p id="healthyRange"></p>
